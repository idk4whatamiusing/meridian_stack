name: CLI smoke test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node src/cli.ts --name smoke --variant both --yes
      - run: ls smoke/apps/api/Cargo.toml smoke/apps/realtime/gleam.toml smoke/apps/web/package.json smoke/DEPLOY.md

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smoke/apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: smoke/apps/api
      - run: node $GITHUB_WORKSPACE/src/cli.ts --name smoke --variant both --yes
      - run: cargo build
      - run: cargo test

  realtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smoke/apps/realtime
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
      - uses: gleamlang/setup-gleam@v1
        with:
          version: "1.18.1"
      - run: node $GITHUB_WORKSPACE/src/cli.ts --name smoke --variant both --yes
      - run: gleam build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smoke/apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node $GITHUB_WORKSPACE/src/cli.ts --name smoke --variant both --yes
      - run: npm install --no-audit --no-fund
      - run: npm run build