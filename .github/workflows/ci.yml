name: CLI smoke test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node src/cli.ts --name smoke --variant both --yes
      - run: ls smoke/db/Cargo.toml smoke/realtime/gleam.toml smoke/ui/package.json smoke/api/go.mod smoke/DEPLOY.md

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: api/go.sum
      - run: node $GITHUB_WORKSPACE/src/cli.ts --name smoke --variant both --yes
        working-directory: /tmp
      - run: cd /tmp/smoke/api && go build ./... && go vet ./...

  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: db
      - uses: arduino/setup-protoc@v3
      - run: node $GITHUB_WORKSPACE/src/cli.ts --name smoke --variant both --yes
        working-directory: /tmp
      - run: cargo build --manifest-path /tmp/smoke/db/Cargo.toml

  realtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
      - uses: gleamlang/setup-gleam@v1
        with:
          version: "1.18.1"
      - run: node $GITHUB_WORKSPACE/src/cli.ts --name smoke --variant both --yes
        working-directory: /tmp
      - run: cd /tmp/smoke/realtime && gleam build

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: node $GITHUB_WORKSPACE/src/cli.ts --name smoke --variant both --yes
        working-directory: /tmp
      - run: cd /tmp/smoke && bun install --frozen-lockfile && bun run build:ui
