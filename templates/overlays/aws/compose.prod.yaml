services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
      - realtime
      - ai

  web:
    build:
      context: ../apps/web
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
    depends_on:
      - api

  api:
    build: ../apps/api
    environment:
      DATABASE_URL: postgres://app:${POSTGRES_PASSWORD}@postgres:5432/app
      REDIS_URL: redis://redis:6379
      CACHE_BACKEND: redis
      BACKEND_SECRET: ${BACKEND_SECRET}
      PORT: "8000"
      # Google OAuth (see .env.example)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      APP_URL: ${APP_URL}
    depends_on:
      - postgres
      - redis

  realtime:
    build: ../apps/realtime
    environment:
      BACKEND_SECRET: ${BACKEND_SECRET}
      REDIS_URL: redis://redis:6379
      PORT: "8001"
    depends_on:
      - redis

  ai:
    build: ../apps/ai
    ports:
      - "8002:8002"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}