name: CD

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy-cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: BUILD_TARGET=export npm run build:ui
      - run: npm install --no-audit --no-fund
        working-directory: gateway
      - name: Deploy gateway worker
        working-directory: gateway
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-aws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ~/app || exit 1
            # both flavor: ui/ is served by the Cloudflare Worker - never check it out on EC2
            git sparse-checkout init --no-cone 2>/dev/null || true
            git sparse-checkout set '/*' '!ui/' || exit 1
            git pull --ff-only || exit 1
            docker compose -f compose.prod.yaml up -d --build
            docker image prune -f